<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Param">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Param</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#6e6e73; --line:#e5e5ea;
  --accent:#0a7d5a; --accent-soft:#e3f4ee; --warn:#c2410c; --warn-soft:#fdecdf; --bad:#d70015;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989f; --line:#2c2c2e;
    --accent:#30d0a0; --accent-soft:#0f2b23; --warn:#ff9f5a; --warn-soft:#2e1b0e; --bad:#ff453a; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));}
main{max-width:560px;margin:0 auto;padding:12px 16px}
h1{font-size:30px;margin:8px 0 12px;letter-spacing:-.5px}
h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:22px 4px 8px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
.big{font-size:32px;font-weight:700;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 .v{font-weight:650;font-size:17px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.month{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.month button{background:var(--card);border:0;color:var(--text);width:40px;height:40px;border-radius:20px;font-size:18px}
.month b{font-size:17px}
.alert{background:var(--warn-soft);color:var(--warn)}
.alert .big{color:var(--warn)}
.cat{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:6px}
.cat .bar{height:6px;margin-top:5px}
.tx{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.tx .d{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .neg{color:var(--accent)}
.day{font-size:13px;color:var(--muted);margin:14px 4px 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);color:var(--text);padding:8px 13px;border-radius:18px;font-size:14px}
.chip.on{background:var(--text);color:var(--bg)}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px}
textarea{min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;background:var(--accent);color:#fff;margin-top:12px}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:none;color:var(--bad)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0}
.ok{color:var(--accent);font-weight:600}
.bad{color:var(--bad);font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.catpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.catpick button{border:2px solid transparent;background:var(--bg);color:var(--text);border-radius:12px;padding:12px 10px;text-align:left;font:inherit;font-size:14px;display:flex;gap:8px;align-items:center}
.catpick button.on{border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px}
.check input{width:22px;height:22px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.donut{width:120px;height:120px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--card)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:20}
</style>
</head>
<body>
<main id="view"></main>
<nav id="nav">
  <button data-tab="ozet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Özet</button>
  <button data-tab="islemler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>İşlemler</button>
  <button data-tab="ekle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>Ekle</button>
  <button data-tab="ayarlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ayarlar</button>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
